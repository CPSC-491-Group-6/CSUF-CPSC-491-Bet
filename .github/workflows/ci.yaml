# ============================================================================
# Bet Project Continuous Integration Pipeline
#
# This workflow validates changes before they are merged into main and then
# repeats the validation after a merge reaches main.
#
# Sprint 2 responsibilities:
#   - Install backend dependencies in a clean environment.
#   - Run backend tests when available.
#   - Install frontend dependencies in a clean environment.
#   - Run frontend linting.
#   - Run frontend tests when available.
#   - Produce a Vite production build.
#   - Assign identifying information to builds created from main.
#   - Preserve successful frontend builds as GitHub Actions artifacts.
#
# Sprint 3 hardening:
#   - Keep all existing backend and frontend checks owned by their scripts.
#   - Cancel outdated pull request validations without skipping main builds.
#   - Bound job duration in case a command stalls.
# ============================================================================

name: Project CI

# ----------------------------------------------------------------------------
# WORKFLOW TRIGGERS
#
# pull_request:
#   Runs CI before code can be merged into main.
#
# push:
#   Runs CI again after the code has actually reached main.
#
# The push trigger is especially important because the Sprint 2 requirement
# states that an automated build must execute with every merge to main.
# ----------------------------------------------------------------------------
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# ----------------------------------------------------------------------------
# SECURITY
#
# The CI workflow only needs permission to read repository contents.
# Giving the workflow the minimum required permissions reduces unnecessary
# access to the repository.
# ----------------------------------------------------------------------------
permissions:
  contents: read

# ----------------------------------------------------------------------------
# CONCURRENCY
#
# A newer commit to the same pull request replaces an outdated validation run.
# Each push to main uses a unique run ID, so every merged commit still gets
# the post-merge validation required by the project.
# ----------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # BACKEND CI
  #
  # The backend job delegates validation to the shared local CI script so
  # developers and GitHub Actions execute the same backend checks.
  # ==========================================================================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    # Stop a stalled job while leaving enough time for SQLite setup and tests.
    timeout-minutes: 15

    steps:
      # ----------------------------------------------------------------------
      # Download the exact Git commit associated with this workflow execution.
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # Configure the Node.js version defined by the repository.
      #
      # GitHub Actions still owns npm caching even though dependency
      # installation itself is performed by scripts/ci-backend.sh.
      # ----------------------------------------------------------------------
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      # ----------------------------------------------------------------------
      # Run the same backend validation available to developers locally.
      #
      # The shared script handles:
      #   - npm ci
      #   - database migrations
      #   - database seeding
      #   - database reset validation
      #   - SQLite artifact checks
      #   - legacy database path checks
      #   - backend tests
      # ----------------------------------------------------------------------
      - name: Run backend CI
        run: ./scripts/ci-backend.sh

  # ==========================================================================
  # FRONTEND CI
  # ==========================================================================
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    # Limit hangs during dependency installation, linting, testing or building.
    timeout-minutes: 10

    # Run from the repository root; ci-frontend.sh handles its own cd.
    # This also keeps build metadata paths relative to the repository root.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      # Delegate all frontend validation to the existing team-maintained
      # script, rather than reimplementing its commands in workflow YAML.
      # This executes npm ci, lint, optional tests, and the Vite build.
      - name: Run frontend CI
        run: ./scripts/ci-frontend.sh

      # Attach build metadata only to successful post-merge builds on main.
      # The script resolves frontend/dist relative to the repository root.
      - name: Create build information
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/generate-build-info.sh frontend/dist

      # Check the required files and metadata before publishing an artifact.
      # This runs only after the frontend test/build and version generation
      # have succeeded. A failed check stops this job before upload.
      - name: Verify versioned frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          test -f frontend/dist/index.html
          test -s frontend/dist/BUILD_INFO.txt
          grep -Fqx "Commit SHA: $GITHUB_SHA" frontend/dist/BUILD_INFO.txt
          grep -Fqx "Workflow Run: $GITHUB_RUN_NUMBER" frontend/dist/BUILD_INFO.txt
          grep -Fqx "Workflow Attempt: $GITHUB_RUN_ATTEMPT" frontend/dist/BUILD_INFO.txt

      # Artifact name: frontend-build-<run>.<attempt>.
      # upload-artifact packages the contents of frontend/dist, including
      # index.html, assets/, and BUILD_INFO.txt. Retain for 30 days, subject
      # to the repository/organization retention cap. Upload is main-only.
      - name: Upload frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-${{ github.run_number }}.${{ github.run_attempt }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 30
